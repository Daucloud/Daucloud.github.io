baseURL = 'https://www.daucloud.com/'
title = "Daucloud's Blog"
theme = 'void'

# 界面文案为英文（i18n 走 en.toml），但内容以中文为主，所以 <html lang> 默认 zh-CN；
# 英文文章在 front matter 里用 language = "en" 逐篇标注，主题据此输出对应的 <html lang>。
languageCode = 'zh-CN'
defaultContentLanguage = 'en'
hasCJKLanguage = true
timeZone = 'Asia/Shanghai'

enableGitInfo = true
enableRobotsTXT = true
relativeURLs = false
canonifyURLs = false
# 忽略特定的警告日志
ignoreLogs = ['warning-goldmark-raw-html']

# 允许在Markdown中使用原始HTML
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$","$$"], ["\\[","\\]"]]
          inline = [["$","$"], ["\\(","\\)"]]
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    # Class-based output; the theme ships light/dark Chroma palettes and highlights each block once.
    noClasses = false
    lineNos = true
    lineNumbersInTable = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false

[params]
  description = 'Share knowledge, experience, and ideas'
  # 社交媒体链接
  [params.social]
    github = "https://github.com/Daucloud"
    zhihu = "https://zhihu.com/people/daucloud"
    email = "1311700152@qq.com"
  [params.avatar]
    url = "/avatar.jpg"

[[menus.main]]
name = 'Home'
identifier = 'nav_home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'Posts'
identifier = 'nav_posts'
pageRef = '/posts'
weight =  20

[[menus.main]]
name = 'Categories'
identifier = 'nav_categories'
pageRef = '/categories'
weight = 25

[[menus.main]]
name = 'Tags'
identifier = 'nav_tags'
pageRef = '/tags'
weight = 30

[[menus.main]]
name = 'About'
identifier = 'nav_about'
pageRef = '/about'
weight = 40

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [module.hugoVersion]
    extended = true
    min = "0.128.0"
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[services]
  [services.disqus]
    shortname = 'dauclouds-blog'

[privacy]
  [privacy.disqus]
    disable = false
